<style>
:root{
  --bg:#FAF3EA;      /* ivory */
  --ink:#0F3B2E;     /* emerald */
  --gold:#A9813F;    /* antique gold */
  --muted:#4B5E56;
  --frame:rgba(169,129,63,.55);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F3B2E;
    --ink:#FAF3EA;
    --gold:#C9A465;
    --muted:#C8D3CC;
    --frame:rgba(201,164,101,.45);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
  background:var(--bg);
  color:var(--ink);
  font-family:Jost,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* Double gold frame, echoing the printed posters */
.frame{
  position:fixed; inset:max(14px, env(safe-area-inset-top,0px)) 14px max(14px, env(safe-area-inset-bottom,0px)) 14px;
  border:1px solid var(--frame); pointer-events:none;
}
.frame::after{content:""; position:absolute; inset:7px; border:1px solid var(--frame); opacity:.6}

main{
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  padding:56px 28px 24px;
}
.emblem{width:min(46vw,220px); height:auto; display:block}

/* --- one orchestrated load sequence --- */
.draw{stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.6s cubic-bezier(.6,0,.2,1) .2s forwards}
.draw:nth-child(2){animation-delay:.45s}
.mono{opacity:0; animation:rise 1.1s ease-out 1.3s forwards}
.orn{opacity:0; transform-origin:300px 300px; transform:scale(.96); animation:settle .9s ease-out 1.9s forwards}
.reveal{opacity:0; transform:translateY(10px); animation:rise 1s ease-out forwards}
.d1{animation-delay:2.1s}.d2{animation-delay:2.4s}.d3{animation-delay:2.7s}.d4{animation-delay:3s}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{to{opacity:1; transform:none}}
@keyframes settle{to{opacity:1; transform:scale(1)}}

.wordmark{
  margin:34px 0 0;
  font-family:"Bodoni Moda",Didot,Georgia,serif; font-weight:500;
  font-size:clamp(30px,6.4vw,54px);
  letter-spacing:.18em; margin-right:-.18em;
  line-height:1;
}
.sub{
  display:flex; align-items:center; gap:16px;
  margin-top:14px; color:var(--gold);
  font-size:clamp(11px,2.6vw,14px); letter-spacing:.7em; margin-right:-.7em;
}
.sub::before,.sub::after{content:""; width:clamp(28px,8vw,64px); height:1px; background:var(--gold)}

h1{
  margin:44px 0 0;
  font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; font-weight:400;
  font-size:clamp(44px,10vw,88px); line-height:1.02;
}
.lede{
  max-width:40ch; margin:18px auto 0;
  font-family:"Cormorant Garamond",Georgia,serif; font-style:italic;
  font-size:clamp(19px,3.6vw,23px); line-height:1.5; color:var(--muted);
}
.cta{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  min-height:48px; margin-top:36px; padding:0 28px;
  border:1px solid var(--gold); color:var(--ink); text-decoration:none;
  font-size:15px; letter-spacing:.08em;
  transition:background-color .25s, color .25s;
}
.cta svg{width:18px;height:18px;fill:currentColor}
.cta:hover{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.cta:focus-visible{outline:2px solid var(--gold); outline-offset:4px}

footer{
  padding:0 28px max(34px, calc(env(safe-area-inset-bottom,0px) + 26px));
  text-align:center; font-size:12px; letter-spacing:.06em; color:var(--muted);
}

@media (prefers-reduced-motion: reduce){
  .draw,.mono,.orn,.reveal{animation:none; opacity:1; transform:none; stroke-dashoffset:0}
}
</style>
</head>
